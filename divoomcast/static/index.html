<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>divoomcast</title>
<style>
  :root{
    --bg:#0e1016; --panel:#161a24; --line:#252b3a; --ink:#e6e9f2;
    --dim:#8b93a8; --accent:#3df07a; --warn:#ffd23f; --bad:#ff3b5c;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 var(--mono);display:flex;justify-content:center;padding:32px 16px}
  .wrap{width:100%;max-width:560px}
  h1{font-size:15px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 4px;
     display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:2px;background:var(--dim);flex:none}
  .dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .dot.err{background:var(--bad)}
  .sub{color:var(--dim);font-size:12px;margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:18px;margin-bottom:14px}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
        color:var(--dim);margin-bottom:6px}
  input,select{width:100%;background:#0b0e14;border:1px solid var(--line);color:var(--ink);
        border-radius:7px;padding:10px 11px;font:13px var(--mono);outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px;margin-top:12px}
  .row>div{flex:1}
  .btns{display:flex;gap:10px;margin-top:16px}
  button{flex:1;padding:11px;border-radius:7px;border:1px solid var(--line);
         background:#0b0e14;color:var(--ink);font:600 13px var(--mono);cursor:pointer}
  button.go{background:var(--accent);color:#06210f;border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:not(:disabled):hover{border-color:var(--accent)}
  .title{font-size:13px;margin-bottom:12px;word-break:break-word}
  .title .st{color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td{padding:4px 0;color:var(--dim)}
  td:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px}
  .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .note{font-size:11px;color:var(--dim);border-left:2px solid var(--warn);
        padding-left:10px;margin-top:14px}
  .err{color:var(--bad);font-size:12px;margin-top:10px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot" id="dot"></span> divoomcast</h1>
  <p class="sub">Cast video to a Divoom MiniToo over Bluetooth</p>

  <div class="card">
    <label for="url">YouTube URL or search</label>
    <input id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
    <div class="row">
      <div>
        <label for="size">Panel size</label>
        <select id="size">
          <option value="128" selected>128 px</option>
          <option value="96">96 px</option>
          <option value="64">64 px</option>
          <option value="32">32 px</option>
        </select>
      </div>
      <div>
        <label for="fps">Frame rate</label>
        <select id="fps">
          <option value="10">10 fps</option>
          <option value="15" selected>15 fps</option>
          <option value="20">20 fps</option>
        </select>
      </div>
      <div>
        <label for="start">Start (s)</label>
        <input id="start" type="number" min="0" step="1" value="0">
      </div>
    </div>
    <div class="btns">
      <button class="go" id="play">Cast</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <div class="err hide" id="err"></div>
    <p class="note">Audio through the panel costs ~89% of display bandwidth.
       Keep sound on another output for a full-rate picture.</p>
  </div>

  <div class="card hide" id="live">
    <div class="title"><span class="st" id="state">idle</span> <span id="title"></span></div>
    <table>
      <tr><td>elapsed</td><td id="m-el">0s</td></tr>
      <tr><td>batches / frames</td><td id="m-bf">0 / 0</td></tr>
      <tr><td>uploaded</td><td id="m-kb">0 KB</td></tr>
      <tr><td>underruns</td><td id="m-ur">0</td></tr>
      <tr><td>truncation</td><td id="m-tr">0%</td></tr>
      <tr><td>link overhead</td><td id="m-oh">0 ms</td></tr>
      <tr><td>throughput</td><td id="m-tx">0 KB/s</td></tr>
      <tr><td>quality rung</td><td id="m-rg">0</td></tr>
    </table>
    <div class="bar"><i id="bar"></i></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = p => fetch(p, {headers:{'Content-Type':'application/json'}});

async function post(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify(body||{})});
  if(!r.ok){ throw new Error((await r.json().catch(()=>({}))).error || r.statusText); }
  return r.json();
}

$('play').onclick = async () => {
  const url = $('url').value.trim();
  if(!url){ $('url').focus(); return; }
  $('err').classList.add('hide');
  try {
    await post('/api/play', {
      url, size:+$('size').value, fps:+$('fps').value, start:+$('start').value||0
    });
  } catch(e){ showErr(e.message); }
};

$('stop').onclick = () => post('/api/stop').catch(e => showErr(e.message));
$('url').addEventListener('keydown', e => { if(e.key === 'Enter') $('play').click(); });

function showErr(m){ $('err').textContent = m; $('err').classList.remove('hide'); }

function render(s){
  const playing = s.state === 'playing' || s.state === 'resolving';
  $('dot').className = 'dot' + (playing ? ' on' : s.state === 'error' ? ' err' : '');
  $('play').disabled = playing;
  $('stop').disabled = !playing;
  $('live').classList.toggle('hide', s.state === 'idle' && !s.batches);
  $('state').textContent = s.state;
  $('title').textContent = s.title || '';
  $('m-el').textContent = (s.elapsed||0).toFixed(0) + 's';
  $('m-bf').textContent = `${s.batches} / ${s.frames}`;
  $('m-kb').textContent = `${s.kbytes} KB`;
  $('m-ur').textContent = s.batches ? `${s.underruns} (${Math.round(100*s.underruns/s.batches)}%)`
                                    : '0';
  $('m-tr').textContent = (s.truncation_pct||0) + '%';
  $('m-oh').textContent = `${s.overhead_ms||0} ms`;
  $('m-tx').textContent = `${s.tx_kbps||0} KB/s`;
  $('m-rg').textContent = s.rung;
  $('bar').style.width = Math.min(100, (s.tx_kbps||0)/2) + '%';
  if(s.error) showErr(s.error);
}

async function poll(){
  try { render(await (await api('/api/status')).json()); }
  catch(e){ $('dot').className = 'dot err'; }
  setTimeout(poll, 700);
}
poll();
</script>
</body>
</html>
