[project]
name = "divoomcast"
version = "0.1.0"
description = "Cast images and video to a Divoom MiniToo pixel panel over Bluetooth RFCOMM"
requires-python = ">=3.10"
dependencies = [
    "pyobjc-framework-IOBluetooth>=10.0",
    "Pillow>=10.0",
    "zstandard>=0.22",
    "av>=12.0",
    "yt-dlp>=2024.1.1",
]

[project.scripts]
divoomcast = "divoomcast.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["divoomcast*"]

[tool.setuptools.package-data]
divoomcast = ["static/*"]
